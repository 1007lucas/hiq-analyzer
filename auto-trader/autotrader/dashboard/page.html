<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동매매 대시보드</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202c;--mute:#5b6878;--line:#dfe4ea;--accent:#0f6fde;--up:#d92b2b;--down:#1f5fd6;
--warn-bg:#fff6dd;--warn-ink:#6b4a00;--bad-bg:#fde8e8;--bad-ink:#8f1d1d;--ok:#157a43;--grid:#e8ecf1;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--ink:#e8edf3;--mute:#9aa7b6;--line:#2b3644;--accent:#59a6ff;
--up:#ff6b6b;--down:#6ea8ff;--warn-bg:#3a2f10;--warn-ink:#ffdf8a;--bad-bg:#44191b;--bad-ink:#ffb4b4;--ok:#4cc38a;--grid:#263140;--chip:#243040}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
main{max-width:1080px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:6px}
h1{font-size:21px;margin:0}h2{font-size:15px;margin:0 0 10px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--chip);color:var(--ink)}
.badge.live{background:#c81e1e;color:#fff}
.status{color:var(--mute);font-size:13px;margin:0 0 14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mute);margin-right:6px;vertical-align:baseline}
.dot.on{background:var(--ok)}
.banner{border-radius:10px;padding:10px 14px;margin:0 0 10px;font-size:14px;word-break:keep-all}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}.banner.bad{background:var(--bad-bg);color:var(--bad-ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 16px}
.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.tile{padding:12px 14px}.tile .k{color:var(--mute);font-size:12px}
.tile .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{padding:16px;margin:0 0 16px}
.up{color:var(--up)}.down{color:var(--down)}.mute{color:var(--mute)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--mute);font-weight:600}th.l,td.l{text-align:left}td.wrap{white-space:normal;min-width:200px;text-align:left}
tr.flag td{background:var(--bad-bg)}
.chip{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-right:4px;background:var(--chip)}
.chip.bad{background:var(--bad-bg);color:var(--bad-ink)}
svg{display:block;width:100%;height:auto}
.axis{fill:var(--mute);font-size:11px}
.empty{color:var(--mute);font-size:13px;margin:0}
ul.events{list-style:none;margin:0;padding:0;max-height:340px;overflow-y:auto;font-size:13px}
ul.events li{padding:5px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
ul.events li.alert{font-weight:600}ul.events .t{color:var(--mute);margin-right:8px;font-variant-numeric:tabular-nums}
footer{color:var(--mute);font-size:12px;margin-top:20px;word-break:keep-all}
.stale{opacity:.45}
</style>
</head>
<body>
<main>
<header><h1>자동매매 대시보드</h1><span id="mode" class="badge">…</span></header>
<p class="status"><span id="dot" class="dot"></span><span id="run">불러오는 중…</span> · 마지막 갱신 <span id="updated">-</span> · 봇 기록 시각 <span id="saved">-</span></p>
<div id="banners"></div>
<div id="content">
<div class="tiles">
<div class="tile"><div class="k">봇 평가금</div><div class="v" id="k-equity">-</div></div>
<div class="tile"><div class="k">오늘 수익률</div><div class="v" id="k-day">-</div></div>
<div class="tile"><div class="k">누적 수익률</div><div class="v" id="k-total">-</div></div>
<div class="tile"><div class="k">현금</div><div class="v" id="k-cash">-</div></div>
<div class="tile"><div class="k">보유 종목 수</div><div class="v" id="k-count">-</div></div>
</div>
<section class="card"><h2>평가금 추이</h2><div id="chart"></div></section>
<section class="card"><h2>보유 종목</h2><div id="positions"></div></section>
<section class="card"><h2>오늘의 계획 <span id="plan-day" class="mute"></span></h2><div id="plans"></div></section>
<section class="card"><h2>최근 주문</h2><div id="orders"></div></section>
<section class="card"><h2>이벤트 로그</h2><ul id="events" class="events"></ul></section>
</div>
<footer>이 화면은 조회 전용입니다. 주문·정지는 명령줄에서만 할 수 있습니다. 표시되는 손익은 봇 장부 기준 추정치이며 증권사 실제 잔고와 다를 수 있습니다.</footer>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
let lastOk = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function num(x) { const n = Number(x); return Number.isFinite(n) ? n : 0; }
function won(x) { return Math.round(num(x)).toLocaleString("ko-KR") + "원"; }
function int(x) { return Math.round(num(x)).toLocaleString("ko-KR"); }
function pct(x) { const v = num(x) * 100; return (v > 0 ? "+" : "") + v.toFixed(2) + "%"; }
function signClass(x) { const v = num(x); return v > 0 ? "up" : v < 0 ? "down" : ""; }
function wonShort(v) {
  const a = Math.abs(v);
  if (a >= 1e8) return (v / 1e8).toFixed(2) + "억";
  if (a >= 1e4) return Math.round(v / 1e4).toLocaleString("ko-KR") + "만";
  return Math.round(v).toLocaleString("ko-KR");
}
function hms(iso) { return iso && iso.length >= 19 ? iso.slice(11, 19) : "-"; }
function stamp(iso) { return iso && iso.length >= 19 ? iso.slice(5, 10) + " " + iso.slice(11, 19) : "-"; }

function table(headers, rows, emptyText) {
  if (!rows.length) return el("p", "empty", emptyText);
  const wrap = el("div", "scroll"), t = el("table"), thead = el("thead"), hr = el("tr"), tb = el("tbody");
  headers.forEach(([text, left]) => hr.appendChild(el("th", left ? "l" : "", text)));
  thead.appendChild(hr); t.appendChild(thead);
  rows.forEach((r) => {
    const tr = el("tr", r.flag ? "flag" : "");
    r.cells.forEach((c) => {
      const td = el("td", c.cls || "");
      if (c.node) td.appendChild(c.node); else td.textContent = c.text === undefined ? "" : String(c.text);
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t);
  return wrap;
}

function svg(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
function drawChart(points) {
  const box = $("chart"); clear(box);
  if (!points.length) { box.appendChild(el("p", "empty", "아직 기록된 평가금이 없습니다. 장 마감 후 하루에 한 번 기록됩니다.")); return; }
  const W = 800, H = 260, L = 70, R = 14, T = 12, B = 28;
  const vals = points.map((p) => num(p.equity));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1e-9) { const pad = Math.abs(hi) * 0.05 || 1; lo -= pad; hi += pad; } else { const pad = (hi - lo) * 0.08; lo -= pad; hi += pad; }
  const n = points.length, pw = W - L - R, ph = H - T - B;
  const x = (i) => L + (n > 1 ? pw * i / (n - 1) : pw / 2), y = (v) => T + ph * (1 - (v - lo) / (hi - lo));
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "평가금 추이 차트" });
  for (let k = 0; k < 4; k++) {
    const v = lo + (hi - lo) * k / 3, yy = y(v);
    s.appendChild(svg("line", { x1: L, y1: yy, x2: W - R, y2: yy, stroke: "var(--grid)", "stroke-width": 1 }));
    s.appendChild(svg("text", { class: "axis", x: L - 6, y: yy + 4, "text-anchor": "end" }, wonShort(v)));
  }
  s.appendChild(svg("text", { class: "axis", x: L, y: H - 8, "text-anchor": "start" }, points[0].day));
  if (n > 1) s.appendChild(svg("text", { class: "axis", x: W - R, y: H - 8, "text-anchor": "end" }, points[n - 1].day));
  if (n > 1) {
    s.appendChild(svg("polyline", { points: vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" "),
      fill: "none", stroke: "var(--accent)", "stroke-width": 2.2, "stroke-linejoin": "round" }));
  }
  s.appendChild(svg("circle", { cx: x(n - 1), cy: y(vals[n - 1]), r: 4, fill: "var(--accent)" }));
  box.appendChild(s);
}

function banner(text, cls) { $("banners").appendChild(el("div", "banner " + cls, text)); }

function render(d) {
  const snap = d.snapshot;
  const mode = $("mode"); mode.textContent = d.mode === "kis-live" ? "실전" : d.mode_label; mode.className = "badge" + (d.mode === "kis-live" ? " live" : "");
  $("dot").className = "dot" + (d.bot_running ? " on" : "");
  $("run").textContent = d.bot_running ? "봇 실행 중" : "봇 꺼짐";
  $("updated").textContent = hms(d.generated_at);
  $("saved").textContent = stamp(d.state_saved_at);
  clear($("banners"));
  if (d.error) banner("⚠️ " + d.error, "bad");
  if (!d.db_exists) banner("아직 이 모드로 봇을 실행한 적이 없습니다. 'python -m autotrader run' 으로 시작하면 여기에 상태가 표시됩니다.", "warn");
  if (d.stop_active) banner("⏸ 긴급 정지(STOP) 상태입니다. 봇은 어떤 주문도 내지 않습니다 (손절 포함). 해제: python -m autotrader resume", "bad");
  if (snap && snap.halted) banner("⛔ 최대 낙폭 한도 초과로 신규 매수가 중단되었습니다. 해제: python -m autotrader resume", "bad");
  if (snap && snap.entries_halted_today) banner("⛔ 오늘 일일 손실 한도에 도달해 신규 매수를 중단했습니다.", "warn");
  if (snap && snap.positions.length && !d.bot_running) banner("⚠️ 봇이 꺼져 있습니다. 보유 종목의 손절·익절이 동작하지 않습니다.", "warn");

  const set = (id, text, cls) => { const e = $(id); e.textContent = text; e.className = "v " + (cls || ""); };
  if (snap) {
    set("k-equity", won(snap.equity)); set("k-day", pct(snap.day_return), signClass(snap.day_return));
    set("k-total", pct(snap.total_return), signClass(snap.total_return)); set("k-cash", won(snap.cash));
    set("k-count", snap.positions.length + "종목");
  } else { ["k-equity", "k-day", "k-total", "k-cash", "k-count"].forEach((id) => set(id, "-")); }
  drawChart(d.equity || []);

  const pos = $("positions"); clear(pos);
  pos.appendChild(table(
    [["종목", 1], ["수량"], ["평균단가"], ["현재가"], ["평가금액"], ["평가손익"], ["손절가 / 익절가"], ["진입일 · 사유", 1]],
    (snap ? snap.positions : []).map((p) => ({ cells: [
      { text: p.name, cls: "l" }, { text: int(p.qty) }, { text: int(p.avg_price) }, { text: int(p.price) }, { text: int(p.value) },
      { text: (num(p.pnl) > 0 ? "+" : "") + int(p.pnl) + " (" + pct(p.pnl_pct) + ")", cls: signClass(p.pnl) },
      { text: (num(p.stop) > 0 ? int(p.stop) : "-") + " / " + (num(p.take_profit) > 0 ? int(p.take_profit) : "-") },
      { text: p.entry_date + " · " + p.entry_reason, cls: "wrap" } ] })),
    "보유 중인 종목이 없습니다."));

  $("plan-day").textContent = snap && snap.day ? "(" + snap.day + ")" : "";
  const kinds = { open: "시가", breakout: "돌파", close: "종가" };
  const plans = $("plans"); clear(plans);
  plans.appendChild(table(
    [["종목", 1], ["진입 계획", 1], ["청산 계획", 1], ["상태", 1], ["메모", 1]],
    (snap ? snap.plans : []).map((p) => {
      const chips = el("span");
      [["entered", "진입함"], ["exited", "청산함"], ["cooldown", "재진입 금지"]].forEach(([k, t]) => { if (p[k]) chips.appendChild(el("span", "chip", t)); });
      [["entry_blocked", "매수 잠김"], ["exit_blocked", "매도 잠김 · 직접 확인"]].forEach(([k, t]) => { if (p[k]) chips.appendChild(el("span", "chip bad", t)); });
      const entry = p.entry ? kinds[p.entry] + " 매수" + (num(p.breakout_target) > 0 ? " (목표가 " + int(p.breakout_target) + ")" : "") : "-";
      return { cells: [ { text: p.name, cls: "l" }, { text: entry, cls: "l" }, { text: p.exit ? kinds[p.exit] + " 매도" : "-", cls: "l" },
        { node: chips, cls: "l" }, { text: p.entry_note || p.exit_note || p.note || "", cls: "wrap" } ] };
    }),
    "오늘 세워진 계획이 없습니다."));

  const statusText = { filled: "체결", partial: "일부 체결", rejected: "거부/미체결", unknown: "확인 필요" };
  const orders = $("orders"); clear(orders);
  orders.appendChild(table(
    [["시각", 1], ["종목", 1], ["구분", 1], ["수량(체결/주문)"], ["체결가"], ["금액"], ["실현손익"], ["상태", 1], ["사유", 1]],
    (d.orders || []).map((o) => {
      const sell = o.side === "sell", bad = o.status === "rejected" || o.status === "unknown";
      return { flag: bad, cells: [ { text: stamp(o.ts), cls: "l" }, { text: o.name || o.symbol, cls: "l" },
        { text: sell ? "매도" : "매수", cls: "l " + (sell ? "down" : "up") }, { text: int(o.filled_qty) + " / " + int(o.qty) },
        { text: num(o.price) > 0 ? int(o.price) : "-" }, { text: num(o.amount) > 0 ? int(o.amount) : "-" },
        { text: o.pnl === null || o.pnl === undefined ? "" : (num(o.pnl) > 0 ? "+" : "") + int(o.pnl) + " (" + pct(o.pnl_pct) + ")", cls: signClass(o.pnl) },
        { text: statusText[o.status] || o.status, cls: "l" }, { text: (o.reason || "") + (bad && o.message ? " — " + o.message : ""), cls: "wrap" } ] };
    }),
    "아직 주문 기록이 없습니다."));

  const ev = $("events"); clear(ev);
  if (!(d.events || []).length) ev.appendChild(el("li", "mute", "기록된 이벤트가 없습니다."));
  (d.events || []).forEach((e) => { const li = el("li", e.level === "alert" ? "alert" : ""); li.appendChild(el("span", "t", stamp(e.ts))); li.appendChild(document.createTextNode(e.message)); ev.appendChild(li); });
}

async function refresh() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
    lastOk = new Date();
    $("content").classList.remove("stale");
  } catch (err) {
    clear($("banners"));
    banner("🔌 대시보드 서버와 연결되지 않습니다" + (lastOk ? " (마지막 성공 " + lastOk.toLocaleTimeString("ko-KR") + ")" : "") + ". 아래 내용은 최신이 아닐 수 있습니다.", "bad");
    $("content").classList.add("stale");
    $("dot").className = "dot"; $("run").textContent = "연결 끊김";
  }
}
refresh();
setInterval(refresh, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
